name: Disable PWA pinch zoom

on:
  push:
    paths:
      - .github/workflows/disable-pinch-pwa.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/disable-pinch-pwa
          fetch-depth: 0

      - name: Disable pinch zoom consistently
        shell: python
        run: |
          from pathlib import Path

          targets = {
              Path("6min-app/index.html"): (
                  'content="width=device-width, initial-scale=1.0, viewport-fit=cover"',
                  '  // ── PWA: Service Worker ────────────────────────────────────────────────',
              ),
              Path("trixxx-app/index.html"): (
                  'content="width=device-width, initial-scale=1.0"',
                  '  /* ── Service Worker ── */',
              ),
          }

          viewport = 'content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"'
          guard = '''  // Impedisce pinch-to-zoom e gesti di ingrandimento, mantenendo lo scroll a un dito.
          for (const eventName of ["gesturestart", "gesturechange", "gestureend"]) {
            document.addEventListener(eventName, event => event.preventDefault(), { passive: false });
          }
          document.addEventListener("touchmove", event => {
            if (event.touches && event.touches.length > 1) event.preventDefault();
          }, { passive: false });

          '''

          for path, (old_viewport, marker) in targets.items():
              text = path.read_text(encoding="utf-8")
              if viewport not in text:
                  if old_viewport not in text:
                      raise RuntimeError(f"Viewport atteso non trovato in {path}")
                  text = text.replace(old_viewport, viewport, 1)
              if "Impedisce pinch-to-zoom e gesti di ingrandimento" not in text:
                  if marker not in text:
                      raise RuntimeError(f"Punto di inserimento non trovato in {path}")
                  text = text.replace(marker, guard + marker, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6min-app/index.html trixxx-app/index.html
          git diff --cached --check
          git commit -m "Disabilita pinch-to-zoom nelle PWA mancanti"
          git push origin HEAD:agent/disable-pinch-pwa
