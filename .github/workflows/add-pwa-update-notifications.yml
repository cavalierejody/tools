name: Add PWA update notifications

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-pwa-update-notifications.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pwa-update-notifications
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          apps = {
            '6min-app/index.html': {
              'style_anchor': '  /* ---------- offline toast ---------- */',
              'body_anchor': '<div id="offline-toast"',
              'script_anchor': '  // ── PWA: Service Worker ────────────────────────────────────────────────',
              'banner': '''\n  #update-bar {\n    display:none; position:fixed; top:max(12px,var(--safe-top)); left:50%; transform:translateX(-50%);\n    z-index:120; background:var(--ink); color:#fff; border-radius:999px; padding:10px 14px;\n    align-items:center; gap:10px; box-shadow:0 8px 28px rgba(0,0,0,.25); font-size:13px;\n  }\n  #update-bar.visible{display:flex}\n  #update-bar button{border:0;border-radius:999px;padding:7px 12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}\n\n''',
              'body': '''<div id="update-bar" role="status" aria-live="polite"><span>Aggiornamento disponibile</span><button id="btn-update-app">Aggiorna</button></div>\n\n''',
              'script': '''  // ── PWA: aggiornamenti ───────────────────────────────────────────────\n  let waitingUpdateWorker = null;\n  const updateBar = document.getElementById('update-bar');\n  const updateButton = document.getElementById('btn-update-app');\n  let reloadingForUpdate = false;\n  navigator.serviceWorker?.addEventListener('controllerchange', () => {\n    if (reloadingForUpdate) return;\n    reloadingForUpdate = true;\n    window.location.reload();\n  });\n\n'''
            },
            'trixxx-app/index.html': {
              'style_anchor': '</style>',
              'body_anchor': '<script>',
              'script_anchor': '  /* ── PWA Install prompt ── */',
              'banner': '''\n#pwa-update-banner{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;background:#111827;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 14px;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);font:600 13px system-ui}\n#pwa-update-banner.show{display:flex}\n#pwa-update-banner button{border:0;border-radius:999px;padding:7px 12px;background:#22c55e;color:#07120b;font-weight:800;cursor:pointer}\n''',
              'body': '''<div id="pwa-update-banner" role="status" aria-live="polite"><span>Aggiornamento disponibile</span><button id="pwa-update-button">Aggiorna</button></div>\n''',
              'script': '''  let trixxxWaitingWorker = null;\n  let trixxxReloading = false;\n  navigator.serviceWorker?.addEventListener('controllerchange',()=>{if(trixxxReloading)return;trixxxReloading=true;location.reload();});\n\n'''
            },
            'super-tris-app/index.html': {
              'style_anchor': '</style>',
              'body_anchor': '<script>',
              'script_anchor': '/* ---------- service worker (offline + installabilità) ---------- */',
              'banner': '''\n#pwa-update-banner{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;background:var(--surface);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:10px 14px;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:.82rem;font-weight:600}\n#pwa-update-banner.show{display:flex}\n#pwa-update-banner button{border:0;border-radius:999px;padding:7px 12px;background:var(--gold);color:#161310;font-weight:800;cursor:pointer}\n''',
              'body': '''<div id="pwa-update-banner" role="status" aria-live="polite"><span>Aggiornamento disponibile</span><button id="pwa-update-button">Aggiorna</button></div>\n''',
              'script': '''let superTrisWaitingWorker=null;\nlet superTrisReloading=false;\nnavigator.serviceWorker?.addEventListener('controllerchange',()=>{if(superTrisReloading)return;superTrisReloading=true;location.reload();});\n\n'''
            },
            'where-is-my-car-app/index.html': {
              'style_anchor': '</style>',
              'body_anchor': '<script>',
              'script_anchor': "        if ('serviceWorker' in navigator) {",
              'banner': '''\n        #pwa-update-banner{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;background:var(--card-current);color:var(--text-current);border-radius:999px;padding:10px 14px;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:13px;font-weight:600}\n        #pwa-update-banner.show{display:flex}\n        #pwa-update-banner button{width:auto;height:34px;border-radius:999px;padding:0 13px;background:var(--accent);color:white;font-size:13px}\n''',
              'body': '''<div id="pwa-update-banner" role="status" aria-live="polite"><span>Aggiornamento disponibile</span><button id="pwa-update-button">Aggiorna</button></div>\n''',
              'script': '''        let whereCarWaitingWorker = null;\n        let whereCarReloading = false;\n        navigator.serviceWorker?.addEventListener('controllerchange', () => {\n            if (whereCarReloading) return;\n            whereCarReloading = true;\n            window.location.reload();\n        });\n\n'''
            }
          }

          for file, cfg in apps.items():
              p=Path(file); text=p.read_text(encoding='utf-8')
              if 'pwa-update-banner' in text or 'id="update-bar"' in text:
                  raise SystemExit(f'Update UI already present in {file}')
              if file=='6min-app/index.html':
                  text=text.replace(cfg['style_anchor'], cfg['banner']+cfg['style_anchor'],1)
                  text=text.replace(cfg['body_anchor'], cfg['body']+cfg['body_anchor'],1)
                  text=text.replace(cfg['script_anchor'], cfg['script']+cfg['script_anchor'],1)
                  old="""      navigator.serviceWorker.register('./sw.js').then(reg => {\n        console.log('[SW] Registrato:', reg.scope);\n      }).catch(err => {"""
                  new="""      navigator.serviceWorker.register('./sw.js').then(reg => {\n        console.log('[SW] Registrato:', reg.scope);\n        const showUpdate = worker => { waitingUpdateWorker = worker; updateBar.classList.add('visible'); };\n        if (reg.waiting) showUpdate(reg.waiting);\n        reg.addEventListener('updatefound', () => {\n          const worker = reg.installing;\n          if (!worker) return;\n          worker.addEventListener('statechange', () => {\n            if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate(worker);\n          });\n        });\n        reg.update();\n        setInterval(() => reg.update(), 60 * 60 * 1000);\n        updateButton.addEventListener('click', () => {\n          updateBar.classList.remove('visible');\n          if (waitingUpdateWorker) waitingUpdateWorker.postMessage({ type: 'SKIP_WAITING' });\n          else window.location.reload();\n        });\n      }).catch(err => {"""
                  if old not in text: raise SystemExit('6min registration anchor missing')
                  text=text.replace(old,new,1)
              else:
                  text=text.replace(cfg['style_anchor'], cfg['banner']+cfg['style_anchor'],1)
                  text=text.replace(cfg['body_anchor'], cfg['body']+cfg['body_anchor'],1)
                  text=text.replace(cfg['script_anchor'], cfg['script']+cfg['script_anchor'],1)
                  if file=='trixxx-app/index.html':
                      old="navigator.serviceWorker.register('./sw.js').catch(()=>{});"
                      new="""navigator.serviceWorker.register('./sw.js').then(reg=>{\n    const banner=document.getElementById('pwa-update-banner');\n    const button=document.getElementById('pwa-update-button');\n    const show=worker=>{trixxxWaitingWorker=worker;banner.classList.add('show');};\n    if(reg.waiting)show(reg.waiting);\n    reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)show(worker);});});\n    reg.update();setInterval(()=>reg.update(),60*60*1000);\n    button.addEventListener('click',()=>{banner.classList.remove('show');if(trixxxWaitingWorker)trixxxWaitingWorker.postMessage({type:'SKIP_WAITING'});else location.reload();});\n  }).catch(()=>{});"""
                  elif file=='super-tris-app/index.html':
                      old="navigator.serviceWorker.register('sw.js').catch(()=>{});"
                      new="""navigator.serviceWorker.register('sw.js').then(reg=>{\n      const banner=document.getElementById('pwa-update-banner');\n      const button=document.getElementById('pwa-update-button');\n      const show=worker=>{superTrisWaitingWorker=worker;banner.classList.add('show');};\n      if(reg.waiting)show(reg.waiting);\n      reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)show(worker);});});\n      reg.update();setInterval(()=>reg.update(),60*60*1000);\n      button.addEventListener('click',()=>{banner.classList.remove('show');if(superTrisWaitingWorker)superTrisWaitingWorker.postMessage({type:'SKIP_WAITING'});else location.reload();});\n    }).catch(()=>{});"""
                  else:
                      old="""navigator.serviceWorker.register('./sw.js')\n                    .then(reg => console.log('[SW] Registrato, scope:', reg.scope))"""
                      new="""navigator.serviceWorker.register('./sw.js')\n                    .then(reg => {\n                        console.log('[SW] Registrato, scope:', reg.scope);\n                        const banner = document.getElementById('pwa-update-banner');\n                        const button = document.getElementById('pwa-update-button');\n                        const show = worker => { whereCarWaitingWorker = worker; banner.classList.add('show'); };\n                        if (reg.waiting) show(reg.waiting);\n                        reg.addEventListener('updatefound', () => {\n                            const worker = reg.installing;\n                            if (!worker) return;\n                            worker.addEventListener('statechange', () => {\n                                if (worker.state === 'installed' && navigator.serviceWorker.controller) show(worker);\n                            });\n                        });\n                        reg.update();\n                        setInterval(() => reg.update(), 60 * 60 * 1000);\n                        button.addEventListener('click', () => {\n                            banner.classList.remove('show');\n                            if (whereCarWaitingWorker) whereCarWaitingWorker.postMessage({ type: 'SKIP_WAITING' });\n                            else window.location.reload();\n                        });\n                    })"""
                  if old not in text: raise SystemExit(f'Registration anchor missing in {file}')
                  text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')

          versions={
            Path('6min-app/sw.js'):("6min-v3","6min-v4"),
            Path('trixxx-app/sw.js'):("trixxx-v1","trixxx-v2"),
            Path('super-tris-app/sw.js'):("super-tris-v1","super-tris-v2"),
            Path('where-is-my-car-app/sw.js'):("whereismycar-v1.4","whereismycar-v1.5"),
          }
          for p,(old,new) in versions.items():
              text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'Version {old} missing in {p}')
              text=text.replace(old,new,1)
              if "message" not in text:
                  text += "\nself.addEventListener('message', event => {\n  if (event.data?.type === 'SKIP_WAITING') self.skipWaiting();\n});\n"
              p.write_text(text,encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 6min-app/index.html 6min-app/sw.js trixxx-app/index.html trixxx-app/sw.js super-tris-app/index.html super-tris-app/sw.js where-is-my-car-app/index.html where-is-my-car-app/sw.js
          git diff --cached --check
          git commit -m "Aggiunge notifiche aggiornamento alle PWA"
          git push origin HEAD:agent/pwa-update-notifications
