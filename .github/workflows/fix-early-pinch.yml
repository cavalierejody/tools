name: Fix early pinch zoom

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-early-pinch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-early-pinch-zoom
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guard = '''<script>
          (() => {
            const blockGesture = event => event.preventDefault();
            document.addEventListener('gesturestart', blockGesture, { passive: false, capture: true });
            document.addEventListener('gesturechange', blockGesture, { passive: false, capture: true });
            document.addEventListener('gestureend', blockGesture, { passive: false, capture: true });
            document.addEventListener('touchmove', event => {
              if (event.touches && event.touches.length > 1) event.preventDefault();
            }, { passive: false, capture: true });
          })();
          </script>
          '''

          # Super Tris: add early guard and disallow browser zoom at CSS level.
          p = Path('super-tris-app/index.html')
          text = p.read_text(encoding='utf-8')
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">\n'
          if guard.strip() not in text:
            if viewport not in text:
              raise SystemExit('Super Tris viewport anchor missing')
            text = text.replace(viewport, viewport + guard, 1)
          text = text.replace('touch-action:manipulation;', 'touch-action:none;', 1)
          p.write_text(text, encoding='utf-8')

          # Calm Breath: install the gesture guard before Tailwind/Fonts can delay the main script.
          p = Path('calm-breath-app/index.html')
          text = p.read_text(encoding='utf-8')
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">\n'
          if guard.strip() not in text:
            if viewport not in text:
              raise SystemExit('Calm Breath viewport anchor missing')
            text = text.replace(viewport, viewport + guard, 1)
          p.write_text(text, encoding='utf-8')

          versions = {
            Path('super-tris-app/sw.js'): ("super-tris-v2", "super-tris-v3"),
            Path('calm-breath-app/sw.js'): ("v1.0.2", "v1.0.3"),
          }
          for path, (old, new) in versions.items():
            text = path.read_text(encoding='utf-8')
            if old not in text:
              raise SystemExit(f'{old} missing in {path}')
            path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add super-tris-app/index.html super-tris-app/sw.js calm-breath-app/index.html calm-breath-app/sw.js
          git diff --cached --check
          git commit -m "Corregge il pinch zoom all'avvio"
          git push origin HEAD:agent/fix-early-pinch-zoom
